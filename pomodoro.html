<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oknote!</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="./my-css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="d-flex main-wrapper">
      <!-- SIDEBAR -->
      <aside class="sidebar d-flex flex-column justify-content-between p-4">
        <div>
          <h1 class="sidebar-title">Hello,<br />Hani!</h1>

          <ul class="nav flex-column mt-5">
            <li class="nav-item mb-3">
              <a href="/dashboard.html" class="nav-link">
                <i class="ri-booklet-fill"></i> Notes
              </a>
            </li>
            <li class="nav-item mb-3">
              <a href="#" class="nav-link">
                <i class="ri-calendar-line"></i> Calendar
              </a>
            </li>
            <li class="nav-item mb-3">
              <a href="#" class="nav-link">
                <i class="ri-artboard-2-line"></i> Canvas
              </a>
            </li>
            <li class="nav-item mb-3">
              <a href="#" class="nav-link selected">
                <i class="ri-timer-line"></i> Pomodoro Timer
              </a>
            </li>
          </ul>
        </div>

        <a href="/index.html" class="logout-btn btn">
          <i class="ri-logout-box-line"></i> Log Out
        </a>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="content p-4 w-100">
        <!-- TOP BAR -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="d-flex align-items-center">
            <img src="./assets/img/oknote-logo.svg" class="logo" />
            <h2 class="logo-text ms-2">Oknote</h2>
          </div>

          <div class="profile d-flex align-items-center">
            <div class="profile-img"></div>
            <div class="ms-2">
              <strong>Elmira Hanani</strong><br />
              <small>admin</small>
            </div>
          </div>
        </div>

        <!-- POMODORO MESSAGE -->
        <div id="timer-message" class="mb-3">
          Please select a timer before starting.
        </div>

        <!-- TIMER CONTENT -->
        <div class="container text-center">
          <div class="timer mx-auto">
            <h1>Pomodoro Timer</h1>

            <div class="glass-card">
              <div class="button-container pb-5">
                <button class="button" id="pomodoro-session">Pomodoro</button>
                <button class="button" id="short-break">Short Break</button>
                <button class="button" id="long-break">Long Break</button>
              </div>

              <div
                id="pomodoro-timer"
                class="timer-display"
                data-duration="25.00"
              >
                25:00
              </div>

              <div id="short-timer" class="timer-display" data-duration="5.00">
                5:00
              </div>

              <div id="long-timer" class="timer-display" data-duration="10.00">
                10:00
              </div>

              <div id="buttons" class="pt-5">
                <button id="start">START</button>
                <button id="stop">STOP</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- SCRIPTS -->
    <script src="/js/pomodoro.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
