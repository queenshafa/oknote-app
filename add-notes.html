<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oknote.</title>
    <link
      rel="shortcut icon"
      href="/assets/img/oknote-logo.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="./my-css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="add-note" id="addNote">
      <div class="container">
        <div class="container-fluid py-4 edit-page">
          <!-- Back Button -->
          <a href="/dashboard.html" class="btn back-btn mb-3">
            <i class="ri-arrow-left-line"></i> Back
          </a>

          <h1 id="addNoteTitle">Add A Note!</h1>

          <!-- Title -->
          <form id="noteForm">
            <!-- Title -->
            <div class="mb-3">
              <label class="form-label fw-bold">Title</label>
              <input
                type="text"
                class="form-control custom-input"
                id="title"
                name="title"
                placeholder="Put the title here.."
                required
              />
            </div>

            <!-- Category -->
            <div class="mb-3 d-flex align-items-center gap-2">
              <div class="flex-grow-1">
                <label class="form-label fw-bold">Category</label>
                <select
                  id="category"
                  name="category"
                  class="form-select custom-input"
                  required
                >
                  <option value="">Choose the Category</option>
                  <option value="personal">Personal</option>
                  <option value="work">Work</option>
                  <option value="school">School</option>
                  <option value="house">House</option>
                </select>
              </div>
            </div>

            <!-- DETAIL WITH TOOLBAR + TEXTAREA -->
            <div class="editor-wrapper mb-4">
              <!-- Toolbar -->
              <div
                class="editor-toolbar d-flex justify-content-center gap-3 px-3 py-2"
              >
                <button
                  type="button"
                  class="tool-btn"
                  onclick="execCmd('bold')"
                >
                  <b>B</b>
                </button>
                <button
                  type="button"
                  class="tool-btn"
                  onclick="execCmd('italic')"
                >
                  <i>I</i>
                </button>
                <button
                  type="button"
                  class="tool-btn"
                  onclick="execCmd('underline')"
                >
                  <u>U</u>
                </button>
                <button
                  type="button"
                  class="tool-btn"
                  onclick="execCmd('insertUnorderedList')"
                >
                  • List
                </button>
                <button
                  type="button"
                  class="tool-btn"
                  onclick="execCmd('insertOrderedList')"
                >
                  1.
                </button>
              </div>

              <!-- CONTENTAREA -->
              <div
                class="editor-area"
                contenteditable="true"
                id="descriptionEditor"
              >
                Put the detail here..
              </div>

              <!-- Hidden real form input -->
              <input type="hidden" id="description" name="description" />
            </div>

            <!-- Color Picker -->
            <div class="mb-4">
              <label class="form-label fw-bold">Change Note Color</label>

              <div class="d-flex gap-3 mt-2 mb-3" id="color">
                <div class="color-circle purple" data-color="purple"></div>
                <div class="color-circle pink" data-color="pink"></div>
                <div class="color-circle yellow" data-color="yellow"></div>
                <div class="color-circle orange" data-color="orange"></div>
                <div class="color-circle green" data-color="green"></div>
              </div>

              <input
                type="hidden"
                name="color"
                id="colorValue"
                value="purple"
              />


            <button type="submit" class="update-btn">Submit</button>
          </form>

          <!-- Footer Row -->
          <!-- <div class="d-flex justify-content-between align-items-center mt-4">
            <button class="update-btn" type="submit">Update Note</button>

            <div class="d-flex gap-4 fs-4 icon-row">
              <i class="ri-pushpin-fill"></i>
              <i class="ri-heart-fill"></i>
              <i class="ri-share-fill"></i>
            </div>
          </div> -->
        </div>
      </div>
    </section>

    <!-- JS -->
   <script src="/js/data.js"></script>
<script src="/js/notesManager.js"></script>
<script src="/js/ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
